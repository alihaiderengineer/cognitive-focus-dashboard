<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Snappy Focus Engine</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons+Round"
      rel="stylesheet"
    />
    <link rel="manifest" href="manifest.json" />

    <style>
      /* ZERO-LATENCY MINIMAL THEME - NO FLUFFY ANIMATIONS */
      :root {
        --text-dark: #0f172a;
        --text-muted: #64748b;
        --accent-blue: #2563eb;
        --accent-break: #f59e0b;
        --accent-namaz: #8b5cf6;
        --accent-panic: #e11d48;
        --pure-white: #ffffff;
        --bg-color: #f8fafc;
        --border-color: #e2e8f0;

        --font-main: "Plus Jakarta Sans", sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-dark);
        font-family: var(--font-main);
        line-height: 1.5;
        padding: 1.5rem 1rem;
        min-height: 100vh;
        display: flex;
        justify-content: center;
      }

      .app-container {
        max-width: 1150px;
        width: 100%;
        display: grid;
        grid-template-columns: 1fr 380px;
        gap: 20px;
        align-items: start;
      }

      @media (max-width: 950px) {
        .app-container {
          grid-template-columns: 1fr;
        }
      }

      /* SOLID FAST CARDS - No Glass, No Blur, No Transitions */
      .solid-card {
        background: var(--pure-white);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      }

      .app-bar {
        grid-column: 1 / -1;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }
      .app-title {
        font-size: 1.4rem;
        font-weight: 800;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .badge {
        background: #f1f5f9;
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 0.85rem;
        font-weight: 700;
        border: 1px solid #cbd5e1;
      }

      .label-sm {
        font-size: 0.8rem;
        font-weight: 800;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-bottom: 8px;
      }
      .heading-xl {
        font-size: 2.5rem;
        font-weight: 800;
        line-height: 1.1;
        margin-bottom: 8px;
      }

      /* INSTANT PROGRESS BARS */
      .prog-track {
        background: #f1f5f9;
        height: 16px;
        border-radius: 8px;
        overflow: hidden;
        margin: 12px 0;
      }
      /* REMOVED TRANSITION FOR INSTANT FEEL */
      .prog-fill {
        background: var(--text-dark);
        height: 100%;
        width: 0%;
        border-radius: 8px;
      }

      .cycle-box {
        margin-top: 24px;
        padding-top: 24px;
        border-top: 1px solid var(--border-color);
      }
      .cycle-time {
        font-size: 4rem;
        font-weight: 800;
        line-height: 1;
        margin-bottom: 8px;
      }

      .list-container {
        margin-top: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .list-item {
        display: flex;
        justify-content: space-between;
        padding: 12px;
        border-radius: 8px;
        background: #f8fafc;
        border: 1px solid var(--border-color);
        font-weight: 600;
        font-size: 0.9rem;
      }
      .list-item.active {
        background: #eff6ff;
        border-color: var(--accent-blue);
        color: var(--accent-blue);
      }

      /* BUTTONS & INPUTS - Sharp & Snappy */
      .btn {
        background: var(--text-dark);
        color: var(--pure-white);
        border: none;
        padding: 12px 20px;
        border-radius: 8px;
        font-weight: 700;
        font-family: var(--font-main);
        cursor: pointer;
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
      }
      .btn:active {
        background: #000;
        transform: scale(0.98);
      } /* Click feedback only */

      .input-wrap {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #f8fafc;
        padding: 10px 12px;
        border-radius: 8px;
        margin-bottom: 8px;
        border: 1px solid var(--border-color);
      }
      .input-wrap input {
        border: none;
        background: transparent;
        font-weight: 700;
        outline: none;
        text-align: right;
        font-family: var(--font-main);
      }

      /* SLEEP RESULTS */
      .sleep-box {
        background: #eff6ff;
        border: 1px dashed var(--accent-blue);
        padding: 12px;
        border-radius: 8px;
        font-size: 0.9rem;
        margin-top: 10px;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="app-container">
      <!-- HEADER -->
      <div class="app-bar">
        <div class="app-title">
          <span class="material-icons-round">bolt</span> Snappy Engine
        </div>
        <div style="display: flex; gap: 8px">
          <!-- NOTIFICATION BRAIN ACTIVATOR -->
          <button
            class="btn"
            id="notify-btn"
            style="
              background: #10b981;
              padding: 6px 12px;
              width: auto;
              font-size: 0.8rem;
            "
          >
            <span class="material-icons-round" style="font-size: 16px"
              >notifications</span
            >
            Enable Brain
          </button>
          <div class="badge" id="day-badge">Loading...</div>
        </div>
      </div>

      <!-- LEFT COLUMN (DOING) -->
      <div style="display: flex; flex-direction: column; gap: 16px">
        <div class="solid-card">
          <div class="label-sm">Active Module</div>
          <div class="heading-xl" id="task-title">Initializing...</div>

          <div class="prog-track">
            <div class="prog-fill" id="task-progress"></div>
          </div>

          <div class="cycle-box" id="cycle-card">
            <div
              class="label-sm"
              id="cycle-status"
              style="color: var(--accent-blue)"
            >
              Focus Cycle Active
            </div>
            <div class="cycle-time" id="cycle-timer">00:00</div>
            <div class="prog-track" style="height: 8px">
              <div class="prog-fill" id="cycle-progress"></div>
            </div>
          </div>

          <div class="label-sm" style="margin-top: 24px">
            Sequence Milestones
          </div>
          <div class="list-container" id="session-itinerary"></div>
        </div>

        <button
          class="btn"
          id="panic-btn"
          style="
            background: var(--pure-white);
            color: var(--accent-panic);
            border: 2px solid var(--accent-panic);
          "
        >
          Urge Protection (15m Lock)
        </button>
        <div
          class="solid-card"
          id="panic-display"
          style="
            display: none;
            text-align: center;
            border-color: var(--accent-panic);
          "
        >
          <div
            class="cycle-time"
            id="panic-countdown"
            style="color: var(--accent-panic)"
          >
            15:00
          </div>
        </div>
      </div>

      <!-- RIGHT COLUMN (THINKING / SETTINGS) -->
      <div style="display: flex; flex-direction: column; gap: 16px">
        <!-- THE NEW SLEEP CALCULATOR -->
        <div class="solid-card">
          <div class="label-sm" style="color: var(--accent-blue)">
            Brain Rest Calculator
          </div>
          <div
            style="
              font-size: 0.85rem;
              margin-bottom: 12px;
              color: var(--text-muted);
            "
          >
            Enter bedtime. Assumes 30 mins to fall asleep. Calculates 90-min REM
            cycles.
          </div>
          <div class="input-wrap">
            <label>Bedtime</label>
            <input type="time" id="time-bed" />
          </div>
          <button
            class="btn"
            id="calc-sleep-btn"
            style="background: var(--accent-blue)"
          >
            Calculate Wake Time
          </button>
          <div class="sleep-box" id="sleep-result"></div>
        </div>

        <!-- SCHEDULE SHIFT -->
        <div class="solid-card">
          <div class="label-sm">Day Shift (Woke Up Late?)</div>
          <div class="input-wrap">
            <label>Wake Time</label><input type="time" id="time-wakeup" />
          </div>
          <div style="display: flex; gap: 8px">
            <button class="btn" id="apply-shift-btn">Apply</button>
            <button
              class="btn"
              id="reset-shift-btn"
              style="background: #e2e8f0; color: #000"
            >
              Reset
            </button>
          </div>
        </div>

        <!-- NAMAZ OVERRIDES -->
        <div class="solid-card">
          <div class="label-sm">Absolute Directives (Prayers)</div>
          <div class="input-wrap">
            <label>Fajr</label
            ><input type="time" id="time-fajr" value="05:00" />
          </div>
          <div class="input-wrap">
            <label>Zuhr</label
            ><input type="time" id="time-zuhr" value="13:30" />
          </div>
          <div class="input-wrap">
            <label>Asr</label><input type="time" id="time-asr" value="16:30" />
          </div>
          <div class="input-wrap">
            <label>Maghrib</label
            ><input type="time" id="time-maghrib" value="18:15" />
          </div>
          <div class="input-wrap">
            <label>Isha</label
            ><input type="time" id="time-isha" value="19:45" />
          </div>
          <button class="btn" id="save-btn" style="margin-top: 8px">
            Save Times
          </button>
        </div>
      </div>
    </div>

    <script>
      // ------------- THE BRAIN (NOTIFICATION ENGINE) -------------
      // ------------- THE BRAIN (NOTIFICATION ENGINE) -------------
      let notificationsEnabled = false;
      let lastNotificationState = "";

      const notifyBtn = document.getElementById("notify-btn");

      // Step 1: Check immediately on page load
      if ("Notification" in window) {
        if (Notification.permission === "granted") {
          // Agar permission pehle se hai, toh button hamesha ke liye chupa do
          notificationsEnabled = true;
          notifyBtn.style.display = "none";
        }
      } else {
        // Agar browser purana hai aur notifications support hi nahi karta
        notifyBtn.style.display = "none";
      }

      // Step 2: Handle button click if permission is NOT granted yet
      notifyBtn.addEventListener("click", () => {
        if (!("Notification" in window)) {
          alert("This browser does not support desktop notification");
        } else if (Notification.permission !== "denied") {
          Notification.requestPermission().then((permission) => {
            if (permission === "granted") {
              notificationsEnabled = true;
              notifyBtn.style.display = "none"; // Click karne ke baad foran gayab
              new Notification("Brain Connected!", {
                body: "You will now get alerts for breaks and focus.",
              });
            }
          });
        }
      });

      function sendNotification(title, body) {
        if (notificationsEnabled && Notification.permission === "granted") {
          new Notification(title, { body: body, icon: "icon-192.png" });
        }
      }

      // ------------- SLEEP CALCULATOR -------------
      document
        .getElementById("calc-sleep-btn")
        .addEventListener("click", () => {
          const bedTime = document.getElementById("time-bed").value;
          if (!bedTime) return;

          const [h, m] = bedTime.split(":").map(Number);

          let sleepDate = new Date();
          sleepDate.setHours(h, m, 0, 0);

          // Add 30 mins sleep latency
          let actualSleepStart = new Date(sleepDate.getTime() + 30 * 60000);

          // 5 cycles = 7.5 hours (450 mins)
          let wake5 = new Date(actualSleepStart.getTime() + 450 * 60000);
          // 6 cycles = 9 hours (540 mins)
          let wake6 = new Date(actualSleepStart.getTime() + 540 * 60000);

          const formatTime = (d) => {
            let hh = d.getHours();
            let mm = d.getMinutes().toString().padStart(2, "0");
            let ampm = hh >= 12 ? "PM" : "AM";
            hh = hh % 12 || 12;
            return `${hh.toString().padStart(2, "0")}:${mm} ${ampm}`;
          };

          const resBox = document.getElementById("sleep-result");
          resBox.style.display = "block";
          resBox.innerHTML = `
          Deep Sleep starts approx: <b>${formatTime(actualSleepStart)}</b><br><br>
          Optimal Wake (7.5 Hrs): <b style="color:var(--accent-blue); font-size:1.1rem;">${formatTime(wake5)}</b><br>
          Max Rest Wake (9 Hrs): <b style="color:var(--text-dark);">${formatTime(wake6)}</b>
        `;
        });

      // ------------- ENGINE LOGIC -------------
      const weekdaySchedule = [
        { start: 0, end: 6, task: "Offline (Memory Sync)" },
        { start: 6, end: 7, task: "Boot Up, Exercise, Fuel" },
        { start: 7, end: 9.5, task: "Frontend Masters (Code & Compile)" },
        { start: 9.5, end: 10.5, task: "Maths Practice (Analog Compute)" },
        { start: 10.5, end: 13, task: "BBIT: LMS Data Stream" },
        { start: 13, end: 14, task: "Low Power Mode (Lunch & Rest)" },
        { start: 14, end: 17, task: "BBIT: Physical Archives Study" },
        { start: 17, end: 18.5, task: "Nature Walk (Dopamine Reset)" },
        { start: 18.5, end: 20, task: "Vanilla JS / CSS Layouts" },
        { start: 20, end: 21, task: "Dinner Phase" },
        { start: 21, end: 22, task: "Crunchyroll Anime (Reward Stream)" },
        { start: 22, end: 24, task: "Offline (Memory Sync)" },
      ];

      const saturdaySchedule = [
        { start: 0, end: 6, task: "Offline Mode" },
        { start: 6, end: 7, task: "Boot Up & Fuel" },
        { start: 7, end: 10, task: "Hands-on Build (Zero Docs)" },
        { start: 10, end: 10.5, task: "Analog Break" },
        { start: 10.5, end: 13, task: "Open Source / Problem Solving" },
        { start: 13, end: 14, task: "Low Power Mode" },
        { start: 14, end: 17, task: "Project Polish / Deploy" },
        { start: 17, end: 18.5, task: "Nature Walk" },
        { start: 18.5, end: 20, task: "Refactoring Code" },
        { start: 20, end: 21, task: "Dinner Phase" },
        { start: 21, end: 22, task: "Crunchyroll Anime (Reward)" },
        { start: 22, end: 24, task: "Offline Mode" },
      ];

      const sundaySchedule = [
        { start: 0, end: 6, task: "Offline Mode" },
        { start: 6, end: 7, task: "Boot Up & Walk" },
        { start: 7, end: 10, task: "Slow Morning (Idle)" },
        { start: 10, end: 13, task: "Unstructured Hobby" },
        { start: 13, end: 14, task: "Low Power Mode" },
        { start: 14, end: 17, task: "Social Connection" },
        { start: 17, end: 18.5, task: "Extended Nature Exposure" },
        { start: 18.5, end: 21, task: "Crunchyroll Binge Session" },
        { start: 21, end: 22, task: "Dinner Phase" },
        { start: 22, end: 24, task: "Offline Mode" },
      ];

      const prayers = ["fajr", "zuhr", "asr", "maghrib", "isha"];

      prayers.forEach((p) => {
        const saved = localStorage.getItem(`namaz-${p}`);
        if (saved) document.getElementById(`time-${p}`).value = saved;
      });

      let scheduleOffset = 0;
      const todayStr = new Date().toDateString();
      const savedWake = localStorage.getItem("wake-time");
      const savedDate = localStorage.getItem("wake-date");

      if (savedWake && savedDate === todayStr) {
        document.getElementById("time-wakeup").value = savedWake;
        scheduleOffset = Math.max(0, timeToDecimal(savedWake) - 6);
      } else {
        localStorage.removeItem("wake-time");
      }

      function timeToDecimal(t) {
        const [h, m] = t.split(":").map(Number);
        return h + m / 60;
      }
      function formatTime(dec) {
        let h = Math.floor(dec);
        let m = Math.round((dec - h) * 60);
        if (m === 60) {
          h++;
          m = 0;
        }
        let displayH = h % 24;
        if (displayH === 0 && m === 0) return "12:00 AM";
        let ampm = displayH >= 12 ? "PM" : "AM";
        return `${(displayH % 12 || 12).toString().padStart(2, "0")}:${m.toString().padStart(2, "0")} ${ampm}`;
      }

      function runEngine() {
        const now = new Date();
        const day = now.getDay();
        let baseSched = weekdaySchedule;
        let mode = "Mon-Fri (Builder)";

        if (day === 0) {
          baseSched = sundaySchedule;
          mode = "Sun (Maintenance)";
        } else if (day === 6) {
          baseSched = saturdaySchedule;
          mode = "Sat (Creator)";
        }

        document.getElementById("day-badge").innerText = mode;

        let sched = baseSched.map((t) => ({
          ...t,
          start: t.start + scheduleOffset,
          end: t.end + scheduleOffset,
        }));
        let currDec =
          now.getHours() + now.getMinutes() / 60 + now.getSeconds() / 3600;
        let effectiveDec = currDec;
        let baseTask = null;
        let isNamaz = false;
        let nName = "";

        sched.forEach((t) => {
          if (currDec >= t.start && currDec < t.end) baseTask = t;
          else if (currDec + 24 >= t.start && currDec + 24 < t.end) {
            baseTask = t;
            effectiveDec = currDec + 24;
          }
        });

        prayers.forEach((p) => {
          let nTime = timeToDecimal(document.getElementById(`time-${p}`).value);
          if (currDec >= nTime && currDec < nTime + 0.25) {
            isNamaz = true;
            nName = p.toUpperCase();
          }
        });

        const tTitle = document.getElementById("task-title");
        const tProg = document.getElementById("task-progress");
        const cycleCard = document.getElementById("cycle-card");
        const itiContainer = document.getElementById("session-itinerary");

        let currentEngineState = ""; // To track changes for Notifications

        if (baseTask) {
          let subEvents = [];
          let t = baseTask.start;
          let blockIdx = 1;

          while (t < baseTask.end) {
            let focusEnd = Math.min(t + 50 / 60, baseTask.end);
            subEvents.push({
              type: "focus",
              start: t,
              end: focusEnd,
              title: `Focus Block ${blockIdx}`,
            });
            if (focusEnd < baseTask.end) {
              let breakEnd = Math.min(focusEnd + 10 / 60, baseTask.end);
              subEvents.push({
                type: "break",
                start: focusEnd,
                end: breakEnd,
                title: `Recovery Break ${blockIdx}`,
              });
              t = breakEnd;
              blockIdx++;
            } else {
              t = focusEnd;
            }
          }

          prayers.forEach((p) => {
            let nTime = timeToDecimal(
              document.getElementById(`time-${p}`).value,
            );
            let adjustedNTime =
              nTime < 12 && baseTask.start > 12 && effectiveDec > 24
                ? nTime + 24
                : nTime;
            if (
              adjustedNTime >= baseTask.start &&
              adjustedNTime < baseTask.end
            ) {
              subEvents.push({
                type: "namaz",
                start: adjustedNTime,
                end: adjustedNTime + 0.25,
                title: `Prayer: ${p}`,
              });
            }
          });

          subEvents.sort((a, b) => a.start - b.start);
          itiContainer.innerHTML = "";

          subEvents.forEach((ev) => {
            let isActive = false;
            if (
              isNamaz &&
              ev.type === "namaz" &&
              effectiveDec >= ev.start &&
              effectiveDec < ev.end
            )
              isActive = true;
            else if (
              !isNamaz &&
              ev.type !== "namaz" &&
              effectiveDec >= ev.start &&
              effectiveDec < ev.end
            )
              isActive = true;

            let cStr = "list-item";
            if (isActive) cStr += " active";

            itiContainer.innerHTML += `
              <div class="${cStr}">
                <span>${ev.title.toUpperCase()}</span>
                <span>${formatTime(ev.start)} - ${formatTime(ev.end)}</span>
              </div>
            `;
          });
        }

        if (isNamaz) {
          currentEngineState = "NAMAZ";
          tTitle.innerText = `${nName} PRAYER`;
          tTitle.style.color = "var(--accent-namaz)";
          let elap =
            currDec -
            timeToDecimal(
              document.getElementById(`time-${nName.toLowerCase()}`).value,
            );
          tProg.style.width = `${Math.max(0, Math.min(100, (elap / 0.25) * 100))}%`;
          tProg.style.background = "var(--accent-namaz)";
          cycleCard.style.display = "none";
        } else if (baseTask) {
          tTitle.innerText = baseTask.task;
          tTitle.style.color = "var(--text-dark)";
          let dur = baseTask.end - baseTask.start;
          let elap = effectiveDec - baseTask.start;
          tProg.style.width = `${Math.max(0, Math.min(100, (elap / dur) * 100))}%`;
          tProg.style.background = "var(--text-dark)";

          cycleCard.style.display = "block";
          let elapsedMins = elap * 60;
          let cycleMin = elapsedMins % 60;
          let isBreak = cycleMin >= 50;

          const cStatus = document.getElementById("cycle-status");
          const cTimer = document.getElementById("cycle-timer");
          const cProg = document.getElementById("cycle-progress");

          if (isBreak) {
            currentEngineState = "BREAK";
            cStatus.innerText = "RECOVERY BREAK ACTIVE";
            cStatus.style.color = "var(--accent-break)";
            cTimer.style.color = "var(--accent-break)";
            let breakRemainMins = 60 - cycleMin;
            cTimer.innerText = `${Math.floor(breakRemainMins).toString().padStart(2, "0")}:${(59 - now.getSeconds()).toString().padStart(2, "0")}`;
            cProg.style.width = `${((cycleMin - 50) / 10) * 100}%`;
            cProg.style.background = "var(--accent-break)";
          } else {
            currentEngineState = "FOCUS";
            cStatus.innerText = "DEEP FOCUS ACTIVE";
            cStatus.style.color = "var(--accent-blue)";
            cTimer.style.color = "var(--text-dark)";
            let focusRemainMins = 50 - cycleMin;
            cTimer.innerText = `${Math.floor(focusRemainMins).toString().padStart(2, "0")}:${(59 - now.getSeconds()).toString().padStart(2, "0")}`;
            cProg.style.width = `${(cycleMin / 50) * 100}%`;
            cProg.style.background = "var(--accent-blue)";
          }
        }

        // TRIGGER NOTIFICATIONS IF STATE CHANGES
        if (
          lastNotificationState !== "" &&
          lastNotificationState !== currentEngineState
        ) {
          if (currentEngineState === "FOCUS")
            sendNotification(
              "🧠 Deep Focus Time",
              "Get back to work! 50 minutes strictly on the task.",
            );
          else if (currentEngineState === "BREAK")
            sendNotification(
              "☕ Break Time!",
              "Step away from the screen for 10 minutes. Relax your eyes.",
            );
          else if (currentEngineState === "NAMAZ")
            sendNotification(
              "🕌 Prayer Time",
              "Time for Namaz. Pause your tasks.",
            );
        }
        lastNotificationState = currentEngineState;
      }

      document.getElementById("save-btn").addEventListener("click", (e) => {
        prayers.forEach((p) =>
          localStorage.setItem(
            `namaz-${p}`,
            document.getElementById(`time-${p}`).value,
          ),
        );
        runEngine();
        e.target.innerText = "Saved";
        setTimeout(() => (e.target.innerText = "Save Times"), 2000);
      });

      document
        .getElementById("apply-shift-btn")
        .addEventListener("click", (e) => {
          const val = document.getElementById("time-wakeup").value;
          if (val) {
            scheduleOffset = Math.max(0, timeToDecimal(val) - 6);
            localStorage.setItem("wake-time", val);
            localStorage.setItem("wake-date", new Date().toDateString());
            runEngine();
            e.target.innerText = "Applied";
            setTimeout(() => (e.target.innerText = "Apply"), 2000);
          }
        });

      document
        .getElementById("reset-shift-btn")
        .addEventListener("click", () => {
          scheduleOffset = 0;
          document.getElementById("time-wakeup").value = "";
          localStorage.removeItem("wake-time");
          runEngine();
        });

      // PANIC BUTTON
      let panicTimerInterval;
      document.getElementById("panic-btn").addEventListener("click", () => {
        const panel = document.getElementById("panic-display");
        const btn = document.getElementById("panic-btn");
        const countdown = document.getElementById("panic-countdown");
        if (panel.style.display === "block") return;
        btn.style.display = "none";
        panel.style.display = "block";
        let sec = 15 * 60;
        panicTimerInterval = setInterval(() => {
          let m = Math.floor(sec / 60)
            .toString()
            .padStart(2, "0");
          let s = (sec % 60).toString().padStart(2, "0");
          countdown.innerText = `${m}:${s}`;
          if (sec <= 0) {
            clearInterval(panicTimerInterval);
            panel.style.display = "none";
            btn.style.display = "block";
            btn.innerHTML = `Protection Over`;
            btn.style.color = "#10b981";
            btn.style.borderColor = "#10b981";
            setTimeout(() => {
              btn.innerHTML = `Urge Protection (15m Lock)`;
              btn.style.color = "var(--accent-panic)";
              btn.style.borderColor = "var(--accent-panic)";
            }, 3000);
          }
          sec--;
        }, 1000);
      });

      runEngine();
      setInterval(runEngine, 1000); // 1 SEC INTERVAL - SHARP
    </script>
  </body>
</html>
